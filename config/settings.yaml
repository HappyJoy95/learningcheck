fields:
  - key: account_source.mode
    label: 账号源模式
    type: select
    default: mail_then_local
    options:
      - value: mail_then_local
        label: 邮件刷新后本地执行
      - value: local
        label: 仅本地文件

  - key: account_source.input_dir
    label: 账号文件目录
    type: text
    default: learning_check/input

  - key: account_source.full_source
    label: 全量账号文件
    type: text
    default: accounts.csv

  - key: account_source.mail.attachment_name
    label: 邮件附件名
    type: text
    default: accounts.csv

  - key: automation.batch_size
    label: 批量重启间隔
    type: number
    default: 30

  - key: automation.ocr_enabled
    label: 启用 OCR
    type: switch
    default: true

  - key: automation.ocr_workers
    label: OCR 并行线程数
    type: number
    default: 2
    show_if: "automation.ocr_enabled"

  - key: notify_enabled
    label: 启用推送
    type: switch
    default: true

  - key: notify_type
    label: 推送方式
    type: checkbox
    default: ["wechat_app"]
    show_if: "notify_enabled"
    options:
      - value: "wechat"
        label: "企业微信"
      - value: "wechat_app"
        label: "企业微信应用"
      - value: "email"
        label: "邮箱"

  - key: notify_wechat_target
    label: 企业微信 Webhook
    type: text
    show_if: "notify_enabled"

  - key: notify_wechat_app_target
    label: 企业微信接收人
    type: text
    show_if: "notify_enabled"
    placeholder: "接收人userid，多人用|分隔"

  - key: notify_email_target
    label: 邮箱接收人
    type: text
    show_if: "notify_enabled"
